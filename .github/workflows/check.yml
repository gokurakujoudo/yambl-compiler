name: checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yambl-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: yambl-compiler
      - uses: actions/checkout@v4
        with:
          repository: gokurakujoudo/yambl
          ref: 4bddb6974c2a7ef1cf47342bbeb30f6d3ba14070
          path: yambl
      - uses: actions/checkout@v4
        with:
          repository: gokurakujoudo/fmc-data-model
          ref: 64322a11eaccabb3a5e8b0d9c3a0be80b195c10f
          path: fmc-data-model
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --timeout 30 --retries 2 -e ".[dev]"
      - run: python -m black --check src tests
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -c "import subprocess, sys; sys.exit(subprocess.call([sys.executable, '-m', 'pyright', '--pythonpath', sys.executable]))"
      - name: Run functional tests with coverage
        run: |
          python -c "
          import unittest
          import coverage

          excluded = ('tests.performance.', 'tests.transactions.test_incremental_large_process.')
          def functional_cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from functional_cases(item)
                  elif item.id().startswith(excluded):
                      print('Excluded performance/scale test:', item.id(), flush=True)
                  else:
                      yield item

          measurement = coverage.Coverage(config_file='pyproject.toml')
          measurement.erase()
          measurement.start()
          try:
              tests = unittest.TestSuite(functional_cases(unittest.defaultTestLoader.discover('tests', top_level_dir='.')))
              if tests.countTestCases() == 0:
                  raise RuntimeError('No functional tests discovered')
              result = unittest.TextTestRunner(verbosity=2).run(tests)
          finally:
              measurement.stop()
              measurement.save()
          raise SystemExit(0 if result.wasSuccessful() else 1)
          "
      - run: python -m coverage report
      - run: python -m coverage json -o build/coverage.json
      - name: Require exact complete coverage in every file
        run: python -c "import json; r = json.load(open('build/coverage.json')); assert all(f['summary']['missing_lines'] == 0 and f['summary']['missing_branches'] == 0 for f in r['files'].values())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: yambl-compiler/build/coverage.json
